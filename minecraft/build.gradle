plugins {
    id 'fabric-loom' version '1.8.13'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories { mavenCentral() }
loom {
    runs {
        client {
            vmArgs '-Xmx2G', '-XX:ActiveProcessorCount=4'
        }
    }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 21 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand 'version':project.version }
}
test { useJUnitPlatform() }

tasks.register('designPreflight', Exec) {
    workingDir '..'
    commandLine System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3', 'tools/design.py', 'check'
}
compileJava.dependsOn designPreflight
